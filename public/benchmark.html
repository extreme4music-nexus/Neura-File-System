<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraFS Benchmark Suite</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 { margin: 0; font-weight: 600; color: var(--primary); }
        p { color: var(--text-muted); }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover:not(:disabled) { opacity: 0.8; }
        button:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
        }
        .status {
            font-family: monospace;
            color: #38bdf8;
            margin-bottom: 1rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>NeuraFS Benchmark Suite</h1>
        <p>Rigorous transparency testing for implicit neural media compression.</p>
    </header>

    <div class="controls">
        <button id="startBtn" onclick="runBenchmarkSuite()">Start Full Benchmark Suite</button>
        <button id="exportBtn" onclick="exportJSON()" disabled>Export Results JSON</button>
    </div>

    <div class="status" id="statusText">System idle. Place files in /storage/benchmark_tests/ to begin.</div>

    <table id="benchmarkTable">
        <thead>
            <tr>
                <th>File</th>
                <th>Orig Size</th>
                <th>HCS Size</th>
                <th>Ratio</th>
                <th>Encode Time</th>
                <th>Decode Time</th>
                <th>DSP Metrics (SI-SDR / LSD / SC)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Results populated here -->
        </tbody>
    </table>

    <script>
        let finalResults = [];

        async function runBenchmarkSuite() {
            const startBtn = document.getElementById('startBtn');
            const exportBtn = document.getElementById('exportBtn');
            const statusText = document.getElementById('statusText');
            const tbody = document.querySelector('#benchmarkTable tbody');
            
            startBtn.disabled = true;
            exportBtn.disabled = true;
            tbody.innerHTML = '';
            finalResults = [];

            try {
                statusText.innerText = "Scanning /storage/benchmark_tests/...";
                const res = await fetch('/api/benchmark/files');
                const data = await res.json();
                
                if (!data.files || data.files.length === 0) {
                    statusText.innerText = "No files found in benchmark directory.";
                    startBtn.disabled = false;
                    return;
                }

                for (let i = 0; i < data.files.length; i++) {
                    const file = data.files[i];
                    statusText.innerText = `Processing [${i+1}/${data.files.length}]: ${file} (Encoding & Reconstructing...)`;
                    
                    const benchRes = await fetch('/api/benchmark/run', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file })
                    });
                    
                    if (benchRes.ok) {
                        const benchData = await benchRes.json();
                        const r = benchData.data;
                        finalResults.push(r);
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${r.filename}</strong></td>
                            <td>${r.original_size}</td>
                            <td>${r.hcs_size}</td>
                            <td style="color: var(--primary);">${r.compression_ratio}</td>
                            <td>${(r.encode_time_ms / 1000).toFixed(2)} s</td>
                            <td>${(r.decode_time_ms / 1000).toFixed(2)} s</td>
                            <td style="font-family: monospace; font-size: 0.85rem; color: #94a3b8;">${r.metrics}</td>
                        `;
                        tbody.appendChild(tr);
                    } else {
                        statusText.innerText = `Error processing ${file}.`;
                        console.error("Benchmark failed for", file);
                    }
                }
                
                statusText.innerText = "Benchmark suite completed successfully.";
                exportBtn.disabled = false;

            } catch (error) {
                statusText.innerText = `Fatal Error: ${error.message}`;
            } finally {
                startBtn.disabled = false;
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(finalResults, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `neurafs_benchmark_${Date.now()}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</body>
</html>
